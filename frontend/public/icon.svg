<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Radar Grid Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#334155" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="256" y1="60" x2="256" y2="452" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="60" y1="256" x2="452" y2="256" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Drone Arms (Cross) -->
  <line x1="140" y1="140" x2="372" y2="372" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="372" y1="140" x2="140" y2="372" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Rotors -->
  <!-- Top-Left -->
  <circle cx="140" cy="140" r="38" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="6"/>
  <circle cx="140" cy="140" r="14" fill="#34d399"/>
  <!-- Top-Right -->
  <circle cx="372" cy="140" r="38" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="6"/>
  <circle cx="372" cy="140" r="14" fill="#34d399"/>
  <!-- Bottom-Left -->
  <circle cx="140" cy="372" r="38" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="6"/>
  <circle cx="140" cy="372" r="14" fill="#34d399"/>
  <!-- Bottom-Right -->
  <circle cx="372" cy="372" r="38" fill="#0f172a" stroke="url(#emeraldGrad)" stroke-width="6"/>
  <circle cx="372" cy="372" r="14" fill="#34d399"/>

  <!-- Central Drone Body / LiDAR Turret -->
  <polygon points="256,190 310,225 310,287 256,322 202,287 202,225" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="6" filter="url(#glow)"/>
  <!-- Central Pulse Ring -->
  <circle cx="256" cy="256" r="24" fill="#10b981"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- LiDAR Scanning Beam -->
  <polygon points="256,256 180,440 332,440" fill="#10b981" opacity="0.15"/>
</svg>
